version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mktwifi
      POSTGRES_PASSWORD: mktwifi
      POSTGRES_DB: mktwifi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mktwifi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://mktwifi:mktwifi@db:5432/mktwifi
      MIKROTIK_IP: 192.168.88.1
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
